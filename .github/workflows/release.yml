name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid release tag: $env:GITHUB_REF_NAME" }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test publishable projects
        shell: pwsh
        run: |
          $tests = @(
            'tests/Franthropy.AgentBridge.Tests/Franthropy.AgentBridge.Tests.csproj',
            'tests/Franthropy.Filtering.Tests/Franthropy.Filtering.Tests.csproj',
            'tests/Franthropy.FFXIV.Tests/Franthropy.FFXIV.Tests.csproj',
            'tests/Franthropy.Web.Tests/Franthropy.Web.Tests.csproj'
          )
          foreach ($project in $tests) {
            dotnet test $project -c Release
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $project" }
          }

      - name: Pack
        shell: pwsh
        run: |
          $projects = @(
            'src/Franthropy.AgentBridge/Franthropy.AgentBridge.csproj',
            'src/Franthropy.Filtering/Franthropy.Filtering.csproj',
            'src/Franthropy.FFXIV/Franthropy.FFXIV.csproj',
            'src/Franthropy.Web/Franthropy.Web.csproj'
          )
          foreach ($project in $projects) {
            dotnet pack $project -c Release -o artifacts/packages `
              -p:Version=${{ steps.version.outputs.value }} `
              -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Pack failed: $project" }
          }

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        shell: pwsh
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/packages/* --verify-tag --generate-notes
