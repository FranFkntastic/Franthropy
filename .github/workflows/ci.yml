name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  reusable-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test shared observations
        run: dotnet test tests/Franthropy.Observations.Tests/Franthropy.Observations.Tests.csproj -c Release

      - name: Test local peer pipes
        run: dotnet test tests/Franthropy.PeerLink.Tests/Franthropy.PeerLink.Tests.csproj -c Release

      - name: Pack reusable projects
        shell: pwsh
        run: |
          $list = 'eng/published-projects.txt'
          $projects = @(Get-Content -LiteralPath $list | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($projects.Count -eq 0) { throw "Pack reusable projects: $list lists no projects." }
          foreach ($project in $projects) {
            if (-not (Test-Path -LiteralPath $project -PathType Leaf)) { throw "Pack reusable projects: $project, listed by $list, does not exist." }
            dotnet pack $project -c Release -o artifacts/packages -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Pack failed: $project" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
