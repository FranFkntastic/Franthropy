name: Table primitives

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/Franthropy.Dalamud/UI/Tables/**'
      - 'tests/Franthropy.Dalamud.Tests/**'
      - 'src/Franthropy.Dalamud/Franthropy.Dalamud.csproj'
      - '.github/workflows/table-primitives.yml'
  push:
    branches: [main]
    paths:
      - 'src/Franthropy.Dalamud/UI/Tables/**'
      - 'tests/Franthropy.Dalamud.Tests/**'
      - '.github/workflows/table-primitives.yml'

permissions:
  contents: read

jobs:
  table-primitives:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Download Dalamud SDK and matching native ImGui
        shell: pwsh
        run: |
          Invoke-WebRequest https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile "$env:RUNNER_TEMP/dalamud.zip"
          Expand-Archive "$env:RUNNER_TEMP/dalamud.zip" "$env:APPDATA/XIVLauncher/addon/Hooks/dev"
      - name: Test table primitives and native renderer
        shell: pwsh
        run: |
          dotnet test tests/Franthropy.Dalamud.Tests/Franthropy.Dalamud.Tests.csproj -c Release --filter "FullyQualifiedName~UI.Tables"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet build src/Franthropy.Dalamud/Franthropy.Dalamud.csproj -c Release -f net8.0-windows --no-restore
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
